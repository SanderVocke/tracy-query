name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-and-test:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: tracy-query-linux-x86_64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=ON
            installed_binary: stage/bin/tracy-query
          - runner: ubuntu-24.04-arm
            asset: tracy-query-linux-arm64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=ON
            installed_binary: stage/bin/tracy-query
          - runner: macos-15-intel
            asset: tracy-query-macos-x86_64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=OFF
            installed_binary: stage/bin/tracy-query
          - runner: macos-15
            asset: tracy-query-macos-arm64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=OFF
            installed_binary: stage/bin/tracy-query
          - runner: windows-2025
            asset: tracy-query-windows-x86_64.exe
            cmake_args: -A x64
            installed_binary: stage/bin/tracy-query.exe
          - runner: windows-11-arm
            asset: tracy-query-windows-arm64.exe
            cmake_args: -A ARM64
            installed_binary: stage/bin/tracy-query.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install and name release binary
        shell: bash
        run: |
          cmake --install build --config Release --prefix stage
          mkdir -p dist
          cmake -E copy "${{ matrix.installed_binary }}" "dist/${{ matrix.asset }}"
          "${{ matrix.installed_binary }}" --version

      - name: Upload uncompressed binary
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.asset }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download uncompressed binaries
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            tracy-query-linux-x86_64
            tracy-query-linux-arm64
            tracy-query-macos-x86_64
            tracy-query-macos-arm64
            tracy-query-windows-x86_64.exe
            tracy-query-windows-arm64.exe
          )
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            test -s "release/$file"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          `tracy-query` 0.1 is a command-line reader for Tracy Profiler 0.13.1 captures.

          This release provides binaries for Linux, macOS, and Windows on x86-64 and ARM64. Tracy and all bundled third-party dependencies are statically linked. Linux binaries are fully static; Windows binaries use the static MSVC runtime; macOS retains only operating-system runtime dependencies.

          See `README.md` for CLI usage and `SKILL.md` for the LLM-agent debugging workflow.
          EOF
          gh release create "${GITHUB_REF_NAME}" release/tracy-query-* \
            --verify-tag \
            --title "tracy-query 0.1" \
            --notes-file release-notes.md
