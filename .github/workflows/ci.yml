name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-and-test:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=ON
            suffix: ""
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=ON
            suffix: ""
          - runner: macos-15-intel
            platform: macos-x86_64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=OFF
            suffix: ""
          - runner: macos-15
            platform: macos-arm64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=OFF
            suffix: ""
          - runner: windows-2025
            platform: windows-x86_64
            cmake_args: -A x64
            suffix: ".exe"
          - runner: windows-11-arm
            platform: windows-arm64
            cmake_args: -A ARM64
            suffix: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-nextest 0.9.116
        shell: bash
        run: |
          mkdir -p /tmp/cargo-nextest-bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) url=https://get.nexte.st/0.9.116/x86_64-unknown-linux-gnu.tar.gz ;;
            Linux-ARM64) url=https://get.nexte.st/0.9.116/aarch64-unknown-linux-gnu.tar.gz ;;
            macOS-*) url=https://get.nexte.st/0.9.116/universal-apple-darwin.tar.gz ;;
            Windows-X64) url=https://get.nexte.st/0.9.116/x86_64-pc-windows-msvc.tar.gz ;;
            Windows-ARM64) url=https://get.nexte.st/0.9.116/aarch64-pc-windows-msvc.tar.gz ;;
            *) echo "unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          curl -LsSf "$url" | tar zxf - -C /tmp/cargo-nextest-bin
          echo /tmp/cargo-nextest-bin >> "${GITHUB_PATH}"
          /tmp/cargo-nextest-bin/cargo-nextest --version | grep 'cargo-nextest 0.9.116'

      - name: Fetch locked Rust dependencies
        shell: bash
        run: |
          cargo fetch --locked --manifest-path tracy-nextest-capture/crates/tracy-nextest-capture/Cargo.toml
          cargo fetch --locked --manifest-path tracy-nextest-capture/tests/fixture/Cargo.toml

      - name: Configure
        env:
          CARGO_NET_OFFLINE: "true"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON \
              -DCARGO_NEXTEST_IN_PROCESS_EXECUTABLE=/tmp/cargo-nextest-bin/cargo-nextest${{ matrix.suffix }} \
              ${{ matrix.cmake_args }}; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Build
        env:
          CARGO_NET_OFFLINE: "true"
        run: cmake --build build --config Release --parallel 2

      - name: Test
        env:
          CARGO_NET_OFFLINE: "true"
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload in-process capture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tracy-nextest-diagnostics-${{ matrix.platform }}
          path: |
            build/nextest-in-process-*/**/*.tracy
            build/nextest-in-process-*/*.{log,txt}
          if-no-files-found: ignore
          retention-days: 7

      - name: Install, smoke-test, and name release binary
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --config Release --prefix stage
          mkdir -p dist
          query="stage/bin/tracy-query${{ matrix.suffix }}"
          "$query" --version | grep 'tracy-query 0.4.0 (Tracy parser 0.13.1)'
          cmake -E copy "$query" "dist/tracy-query-${{ matrix.platform }}${{ matrix.suffix }}"
          test -s "dist/tracy-query-${{ matrix.platform }}${{ matrix.suffix }}"

      - name: Upload uncompressed query binary
        uses: actions/upload-artifact@v7
        with:
          name: tracy-query-${{ matrix.platform }}
          path: dist/tracy-query-${{ matrix.platform }}${{ matrix.suffix }}
          archive: false
          if-no-files-found: error

  sanitizers:
    name: embedded capture sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-nextest 0.9.116
        shell: bash
        run: |
          mkdir -p /tmp/cargo-nextest-bin
          curl -LsSf https://get.nexte.st/0.9.116/linux | tar zxf - -C /tmp/cargo-nextest-bin
          echo /tmp/cargo-nextest-bin >> "${GITHUB_PATH}"
          /tmp/cargo-nextest-bin/cargo-nextest --version | grep 'cargo-nextest 0.9.116'
      - name: Configure ASan and UBSan
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake -S . -B build-sanitize -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TESTING=ON \
              -DTRACY_QUERY_FULLY_STATIC=OFF \
              -DCARGO_NEXTEST_IN_PROCESS_EXECUTABLE=/tmp/cargo-nextest-bin/cargo-nextest \
              "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize=alignment" \
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize=alignment" \
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path tracy-nextest-capture/crates/tracy-nextest-capture/Cargo.toml
          cargo fetch --locked --manifest-path tracy-nextest-capture/tests/fixture/Cargo.toml
      - name: Build tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cmake --build build-sanitize --parallel 2
      - name: Run embedded capture tests repeatedly
        env:
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TRACY_QUERY_NATIVE_SANITIZER_LIBS: asan,ubsan
          CARGO_NET_OFFLINE: "true"
        run: |
          for attempt in 1 2 3; do
            ctest --test-dir build-sanitize \
              -R 'embedded-transport-|embedded-capture-|nextest-in-process-(failure|always)' \
              --output-on-failure
          done

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build-and-test, sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download uncompressed query binaries
        uses: actions/download-artifact@v8
        with:
          pattern: tracy-query-*
          path: release
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v0.4.0"
          expected=(
            tracy-query-linux-x86_64
            tracy-query-linux-arm64
            tracy-query-macos-x86_64
            tracy-query-macos-arm64
            tracy-query-windows-x86_64.exe
            tracy-query-windows-arm64.exe
          )
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            test -s "release/$file"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          `tracy-extensions` 0.4.0 includes `tracy-query` for Tracy Profiler 0.13.1 captures and provides failure-only in-process per-test capture for cargo-nextest.

          This release provides `tracy-query` for Linux, macOS, and Windows on x86-64 and ARM64. Tracy and all bundled third-party dependencies are statically linked. Linux binaries are fully static; Windows binaries use the static MSVC runtime; macOS retains only operating-system runtime dependencies.

          See `README.md` for CLI usage, `tracy-nextest-capture/docs/usage.md` for per-test capture, and `tracy-query/SKILL.md` for the LLM-agent debugging workflow.
          EOF
          gh release create "${GITHUB_REF_NAME}" release/tracy-query-* tracy-query/SKILL.md \
            --verify-tag \
            --title "tracy-extensions 0.4.0" \
            --notes-file release-notes.md
