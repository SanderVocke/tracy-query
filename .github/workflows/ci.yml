name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-and-test:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=ON
            suffix: ""
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=ON
            suffix: ""
          - runner: macos-15-intel
            platform: macos-x86_64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=OFF
            suffix: ""
          - runner: macos-15
            platform: macos-arm64
            cmake_args: -DTRACY_QUERY_FULLY_STATIC=OFF
            suffix: ""
          - runner: windows-2025
            platform: windows-x86_64
            cmake_args: -A x64
            suffix: ".exe"
          - runner: windows-11-arm
            platform: windows-arm64
            cmake_args: -A ARM64
            suffix: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-nextest 0.9.116
        shell: bash
        run: |
          mkdir -p /tmp/cargo-nextest-bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) url=https://get.nexte.st/0.9.116/x86_64-unknown-linux-gnu.tar.gz ;;
            Linux-ARM64) url=https://get.nexte.st/0.9.116/aarch64-unknown-linux-gnu.tar.gz ;;
            macOS-*) url=https://get.nexte.st/0.9.116/universal-apple-darwin.tar.gz ;;
            Windows-X64) url=https://get.nexte.st/0.9.116/x86_64-pc-windows-msvc.tar.gz ;;
            Windows-ARM64) url=https://get.nexte.st/0.9.116/aarch64-pc-windows-msvc.tar.gz ;;
            *) echo "unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          curl -LsSf "$url" | tar zxf - -C /tmp/cargo-nextest-bin
          echo /tmp/cargo-nextest-bin >> "${GITHUB_PATH}"
          /tmp/cargo-nextest-bin/cargo-nextest --version | grep 'cargo-nextest 0.9.116'

      - name: Fetch locked Rust dependencies
        shell: bash
        run: |
          cargo fetch --locked --manifest-path rust/tracy-nextest-capture/Cargo.toml
          cargo fetch --locked --manifest-path tests/nextest-in-process-fixture/Cargo.toml

      - name: Configure
        env:
          CARGO_NET_OFFLINE: "true"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON \
              -DCARGO_NEXTEST_IN_PROCESS_EXECUTABLE=/tmp/cargo-nextest-bin/cargo-nextest${{ matrix.suffix }} \
              ${{ matrix.cmake_args }}; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Build
        env:
          CARGO_NET_OFFLINE: "true"
        run: cmake --build build --config Release --parallel 2

      - name: Test
        env:
          CARGO_NET_OFFLINE: "true"
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install, smoke-test, and name release binaries
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --config Release --prefix stage
          mkdir -p dist
          query="stage/bin/tracy-query${{ matrix.suffix }}"
          collector="stage/bin/tracy-collector${{ matrix.suffix }}"
          "$query" --version
          "$collector" --version
          cmake -E copy "$query" "dist/tracy-query-${{ matrix.platform }}${{ matrix.suffix }}"
          cmake -E copy "$collector" "dist/tracy-collector-${{ matrix.platform }}${{ matrix.suffix }}"
          test -s "dist/tracy-query-${{ matrix.platform }}${{ matrix.suffix }}"
          test -s "dist/tracy-collector-${{ matrix.platform }}${{ matrix.suffix }}"

      - name: Upload uncompressed query binary
        uses: actions/upload-artifact@v7
        with:
          name: tracy-query-${{ matrix.platform }}
          path: dist/tracy-query-${{ matrix.platform }}${{ matrix.suffix }}
          archive: false
          if-no-files-found: error

      - name: Upload uncompressed collector binary
        uses: actions/upload-artifact@v7
        with:
          name: tracy-collector-${{ matrix.platform }}
          path: dist/tracy-collector-${{ matrix.platform }}${{ matrix.suffix }}
          archive: false
          if-no-files-found: error

  collector-sanitizers:
    name: collector sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-nextest 0.9.116
        shell: bash
        run: |
          mkdir -p /tmp/cargo-nextest-bin
          curl -LsSf https://get.nexte.st/0.9.116/linux | tar zxf - -C /tmp/cargo-nextest-bin
          echo /tmp/cargo-nextest-bin >> "${GITHUB_PATH}"
          /tmp/cargo-nextest-bin/cargo-nextest --version | grep 'cargo-nextest 0.9.116'
      - name: Configure ASan and UBSan
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake -S . -B build-sanitize -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TESTING=ON \
              -DTRACY_QUERY_FULLY_STATIC=OFF \
              -DCARGO_NEXTEST_IN_PROCESS_EXECUTABLE=/tmp/cargo-nextest-bin/cargo-nextest \
              "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize=alignment" \
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize=alignment" \
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path rust/tracy-nextest-capture/Cargo.toml
          cargo fetch --locked --manifest-path tests/nextest-in-process-fixture/Cargo.toml
      - name: Build collector tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cmake --build build-sanitize --parallel 2
      - name: Run collector tests repeatedly
        env:
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TRACY_QUERY_NATIVE_SANITIZER_LIBS: asan,ubsan
          CARGO_NET_OFFLINE: "true"
        run: |
          for attempt in 1 2 3; do
            ctest --test-dir build-sanitize \
              -R 'embedded-transport-|embedded-capture-native|embedded-capture-discard|embedded-capture-error|embedded-capture-rust|nextest-in-process-(failure|always)' \
              --output-on-failure
          done
          ctest --test-dir build-sanitize \
            -R 'collector-unit|collector-protocol-live' \
            --output-on-failure

  collector-nextest:
    name: pinned nextest architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-nextest 0.9.116
        shell: bash
        run: |
          mkdir -p /tmp/cargo-nextest-bin
          curl -LsSf https://get.nexte.st/0.9.116/linux | tar zxf - -C /tmp/cargo-nextest-bin
          echo /tmp/cargo-nextest-bin >> "${GITHUB_PATH}"
          /tmp/cargo-nextest-bin/cargo-nextest --version | grep 'cargo-nextest 0.9.116'
      - name: Configure and build
        run: |
          for attempt in 1 2 3; do
            if cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTRACY_QUERY_FULLY_STATIC=OFF -DCARGO_NEXTEST_EXECUTABLE=/tmp/cargo-nextest-bin/cargo-nextest; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          cmake --build build --parallel 2
      - name: Run nextest/JUnit collector contract
        run: ctest --test-dir build -R collector-nextest-contract --output-on-failure
      - name: Upload reference adapter evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collector-nextest-evidence
          path: |
            build/nextest-integration/junit.xml
            build/nextest-integration/manifest.json
            build/nextest-integration/daemon/output/*.tracy
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build-and-test, collector-sanitizers, collector-nextest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download uncompressed query binaries
        uses: actions/download-artifact@v8
        with:
          pattern: tracy-query-*
          path: release
          merge-multiple: true

      - name: Download uncompressed collector binaries
        uses: actions/download-artifact@v8
        with:
          pattern: tracy-collector-*
          path: release
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            tracy-query-linux-x86_64
            tracy-query-linux-arm64
            tracy-query-macos-x86_64
            tracy-query-macos-arm64
            tracy-query-windows-x86_64.exe
            tracy-query-windows-arm64.exe
            tracy-collector-linux-x86_64
            tracy-collector-linux-arm64
            tracy-collector-macos-x86_64
            tracy-collector-macos-arm64
            tracy-collector-windows-x86_64.exe
            tracy-collector-windows-arm64.exe
          )
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            test -s "release/$file"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          `tracy-query` 0.2.0 reads Tracy Profiler 0.13.1 captures, and `tracy-collector` collects per-attempt in-memory captures for nextest-style test suites.

          This release provides both executables for Linux, macOS, and Windows on x86-64 and ARM64. Tracy and all bundled third-party dependencies are statically linked. Linux binaries are fully static; Windows binaries use the static MSVC runtime; macOS retains only operating-system runtime dependencies.

          See `README.md` for CLI and collector usage, `docs/collector-protocol.md` for the integration contract, and `SKILL.md` for the LLM-agent debugging workflow.
          EOF
          gh release create "${GITHUB_REF_NAME}" release/tracy-query-* release/tracy-collector-* SKILL.md \
            --verify-tag \
            --title "tracy-query 0.2.0" \
            --notes-file release-notes.md
