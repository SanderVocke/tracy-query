name: Publish existing CI artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      artifact_run_id:
        description: Successful tagged CI run containing the release binaries
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish GitHub release from CI artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Download uncompressed query binaries
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          pattern: tracy-query-*
          path: release
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            tracy-query-linux-x86_64
            tracy-query-linux-arm64
            tracy-query-macos-x86_64
            tracy-query-macos-arm64
            tracy-query-windows-x86_64.exe
            tracy-query-windows-arm64.exe
          )
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            test -s "release/$file"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$RELEASE_TAG" = "v0.4.0"
          cat > release-notes.md <<'EOF'
          `tracy-extensions` 0.4.0 includes `tracy-query` for Tracy Profiler 0.13.1 captures and provides failure-only in-process per-test capture for cargo-nextest.

          This release provides `tracy-query` for Linux, macOS, and Windows on x86-64 and ARM64. Tracy and all bundled third-party dependencies are statically linked. Linux binaries are fully static; Windows binaries use the static MSVC runtime; macOS retains only operating-system runtime dependencies.

          See `README.md` for CLI usage, `tracy-nextest-capture/docs/usage.md` for per-test capture, and `tracy-query/SKILL.md` for the LLM-agent debugging workflow.
          EOF
          gh release create "$RELEASE_TAG" release/tracy-query-* \
            --verify-tag \
            --title "tracy-extensions 0.4.0" \
            --notes-file release-notes.md
