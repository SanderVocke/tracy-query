[package]
name = "tracy-nextest-capture"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Failure-only in-process Tracy capture for cargo-nextest tests"

[dependencies]
tracy-client = { version = "=0.18.4", default-features = false, features = ["enable", "manual-lifetime"] }
tracy-client-sys = { version = "=0.28.0", default-features = false, features = ["embedded-capture"] }
tracy-nextest-capture-macros = { path = "../tracy-nextest-capture-macros" }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
tracy-client-sys = { path = "../tracy-client-sys" }
